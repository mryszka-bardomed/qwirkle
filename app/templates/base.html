<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Qwirkle{% endblock %} · Qwirkle</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('newsletter.landing') }}">Qwirkle</a>
    <nav>
      {% if current_user.is_authenticated %}
        <span class="muted">{{ current_user.username }}</span>
        <form method="post" action="{{ url_for('auth.logout') }}" class="inline">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button class="link">Wyloguj</button>
        </form>
      {% else %}
        <a href="{{ url_for('auth.login') }}">Zaloguj</a>
        <a href="{{ url_for('auth.register') }}">Rejestracja</a>
      {% endif %}
    </nav>
  </header>

  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash flash-{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
